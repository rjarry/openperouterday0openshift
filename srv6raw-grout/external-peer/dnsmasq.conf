# dnsmasq configuration for OpenShift cluster DNS
# Runs on the external peer, listening on the VRF red loopback (10.100.0.1).
#
# OCP nodes reach this via SRv6 L3VPN through VRF red.
# Upstream queries go directly to the lab DNS server.

listen-address=127.0.0.100
listen-address=10.100.0.1
listen-address=fd00:100::1
bind-interfaces
no-hosts

# Local domain
local=/sno-lab.example.com/
domain=sno-lab.example.com

# API VIP
address=/api.sno-lab.example.com/192.168.110.10
address=/api.sno-lab.example.com/fd00:110::10
address=/api-int.sno-lab.example.com/192.168.110.10
address=/api-int.sno-lab.example.com/fd00:110::10

# Ingress VIP (wildcard)
address=/.apps.sno-lab.example.com/192.168.110.11
address=/.apps.sno-lab.example.com/fd00:110::11
