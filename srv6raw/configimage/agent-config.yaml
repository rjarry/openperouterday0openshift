apiVersion: v1alpha1
metadata:
  name: sno-lab
  namespace: cluster0
additionalNTPSources:
- 10.100.0.1
rendezvousIP: 192.168.110.2
hosts:
- hostname: master-0
  interfaces:
  - name: eno12399np0
    macAddress: xx:xx:xx:xx:xx:xx
  networkConfig:
    interfaces:
    - name: eno12399np0
      type: ethernet
      state: up
      ipv4:
        enabled: false
      ipv6:
        enabled: false
      ethernet:
        sr-iov:
          total-vfs: 8
          vfs:
          - id: 0 # underlay
            vlan-id: 0
            spoof-check: false
            trust: true
          - id: 1 # trunk
            vlan-id: 0
            spoof-check: false
            trust: true
          - id: 2 # host
            vlan-id: 42
            spoof-check: false
            trust: true
    - name: eno12399v2  # vf2 host
      type: ethernet
      state: up
      ipv4:
        enabled: true
        auto-dns: false
        address:
        - ip: 192.168.110.2
          prefix-length: 24
        dhcp: false
      ipv6:
        enabled: true
        auto-dns: false
        autoconf: false
        address:
        - ip: fd00:110::2
          prefix-length: 64
        dhcp: false
    dns-resolver:
      config:
        server:
        - 192.168.110.1
        - fd00:110::1
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 192.168.110.1
        next-hop-interface: eno12399v2
        table-id: 254
      - destination: ::/0
        next-hop-address: fd00:110::1
        next-hop-interface: eno12399v2
        table-id: 254
